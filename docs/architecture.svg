<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 166" width="660" height="166" role="img" aria-label="CoverageDesk container diagram">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1f4e79"/>
    </marker>
  </defs>
  <g font-family="-apple-system, Helvetica Neue, Arial, sans-serif" fill="#1a1a1a">

    <!-- external, top -->
    <rect x="24" y="2" width="108" height="24" rx="3" fill="#fff" stroke="#5c6370" stroke-dasharray="3 2"/>
    <text x="78" y="17" font-size="9.5" text-anchor="middle">Google OIDC</text>
    <rect x="232" y="2" width="150" height="24" rx="3" fill="#fff" stroke="#5c6370" stroke-dasharray="3 2"/>
    <text x="307" y="17" font-size="9.5" text-anchor="middle">Prometheus → Grafana</text>

    <!-- request path -->
    <rect x="14" y="54" width="128" height="38" rx="3" fill="#f4f6f9" stroke="#1f4e79"/>
    <text x="78" y="70" font-size="10" font-weight="600" text-anchor="middle">Browser</text>
    <text x="78" y="83" font-size="8.5" fill="#5c6370" text-anchor="middle">Next.js SPA</text>

    <rect x="224" y="54" width="166" height="38" rx="3" fill="#f4f6f9" stroke="#1f4e79"/>
    <text x="307" y="70" font-size="10" font-weight="600" text-anchor="middle">FastAPI · API</text>
    <text x="307" y="83" font-size="8.5" fill="#5c6370" text-anchor="middle">auth · coverage</text>

    <rect x="470" y="54" width="176" height="38" rx="3" fill="#f4f6f9" stroke="#1f4e79"/>
    <text x="558" y="70" font-size="10" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <text x="558" y="83" font-size="8.5" fill="#5c6370" text-anchor="middle">users · coverages · shares · results</text>

    <!-- worker -->
    <rect x="470" y="120" width="176" height="34" rx="3" fill="#f4f6f9" stroke="#1f4e79"/>
    <text x="558" y="134" font-size="10" font-weight="600" text-anchor="middle">Background worker</text>
    <text x="558" y="146" font-size="8.5" fill="#5c6370" text-anchor="middle">edgar · insight</text>

    <!-- external, bottom -->
    <rect x="14" y="104" width="150" height="22" rx="3" fill="#fff" stroke="#5c6370" stroke-dasharray="3 2"/>
    <text x="89" y="118" font-size="9.5" text-anchor="middle">SEC EDGAR API</text>
    <rect x="14" y="132" width="150" height="22" rx="3" fill="#fff" stroke="#5c6370" stroke-dasharray="3 2"/>
    <text x="89" y="146" font-size="9.5" text-anchor="middle">DRIFT LLM server</text>

    <!-- arrows -->
    <g stroke="#1f4e79" fill="none" marker-end="url(#a)">
      <path d="M78,54 L78,30"/>
      <path d="M307,54 L307,30"/>
      <path d="M142,73 L219,73"/>
      <path d="M390,73 L465,73"/>
      <path d="M558,120 L558,96"/>
      <path d="M470,137 L200,137 M200,115 L169,115"/>
      <path d="M200,137 L200,143 L169,143"/>
    </g>
    <path d="M200,137 L200,115" stroke="#1f4e79" fill="none"/>

    <g font-size="8.5" fill="#5c6370">
      <text x="84" y="46">login</text>
      <text x="313" y="46">metrics</text>
      <text x="180" y="68" text-anchor="middle">HTTPS + JWT</text>
      <text x="427" y="68" text-anchor="middle">read / write</text>
      <text x="564" y="112">writes results</text>
      <text x="340" y="132" text-anchor="middle">fetch / prompt</text>
      <text x="658" y="163" text-anchor="end" font-size="8">dashed = external service</text>
    </g>
  </g>
</svg>
